name: MeshScope Unsigned IPA

on:
  push:
    branches:
      - meshscope-unsigned-build
    paths:
      - "ci/meshscope/**"
      - ".github/workflows/meshscope-unsigned-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meshscope-unsigned-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned device IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode and show environment
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/MeshScope-source.tar.xz"
          ENCODED="$RUNNER_TEMP/MeshScope-source.tar.xz.b64"
          SOURCE_PARENT="$RUNNER_TEMP/meshscope-source"

          cat \
            ci/meshscope/source.xz.b64.part00 \
            ci/meshscope/source.xz.b64.part01 \
            ci/meshscope/source.xz.b64.part02 \
            ci/meshscope/source.xz.b64.part03 \
            ci/meshscope/source.xz.b64.part04 \
            > "$ENCODED"

          python3 - "$ENCODED" "$ARCHIVE" <<'PY'
          import base64
          import pathlib
          import sys

          encoded = pathlib.Path(sys.argv[1]).read_bytes()
          decoded = base64.b64decode(encoded, validate=True)
          pathlib.Path(sys.argv[2]).write_bytes(decoded)
          print(f"decoded {len(decoded)} bytes")
          PY

          printf '%s  %s\n' \
            '4265cf7d47e99a14685a1e5512f12a2cb24400033471cb6ba14908d7abe35d4d' \
            "$ARCHIVE" | shasum -a 256 -c -

          mkdir -p "$SOURCE_PARENT"
          tar -xJf "$ARCHIVE" -C "$SOURCE_PARENT"
          test -f "$SOURCE_PARENT/MeshScope/project.yml"
          test -f "$SOURCE_PARENT/MeshScope/MeshScope/Renderer/MetalRenderer.swift"

          # The compact build archive omits test fixtures. Keep only product targets
          # in the CI manifest so SwiftPM does not validate an absent test path.
          cat > "$SOURCE_PARENT/MeshScope/Core/Package.swift" <<'SWIFT'
          // swift-tools-version: 5.9
          import PackageDescription

          let package = Package(
              name: "MeshScopeCore",
              platforms: [.iOS(.v17), .macOS(.v14)],
              products: [
                  .library(name: "MeshScopeCore", targets: ["MeshScopeCore"])
              ],
              targets: [
                  .target(
                      name: "CZlib",
                      path: "Sources/CZlib",
                      publicHeadersPath: "include",
                      linkerSettings: [.linkedLibrary("z")]
                  ),
                  .target(
                      name: "MeshScopeCore",
                      dependencies: ["CZlib"],
                      path: "Sources/MeshScopeCore"
                  )
              ]
          )
          SWIFT

          echo "SOURCE_ROOT=$SOURCE_PARENT/MeshScope" >> "$GITHUB_ENV"

      - name: Generate deterministic app icon
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$SOURCE_ROOT/MeshScope/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png" <<'PY'
          import math
          import pathlib
          import struct
          import sys
          import zlib

          output = pathlib.Path(sys.argv[1])
          output.parent.mkdir(parents=True, exist_ok=True)
          width = height = 1024
          rows = bytearray()

          for y in range(height):
              rows.append(0)
              ny = (y - height / 2) / (height / 2)
              for x in range(width):
                  nx = (x - width / 2) / (width / 2)
                  radius = math.sqrt(nx * nx + ny * ny)
                  glow = max(0.0, 1.0 - radius)
                  grid = 14 if ((x // 96) + (y // 96)) % 2 == 0 else 0
                  r = int(min(255, 14 + 18 * glow + grid // 4))
                  g = int(min(255, 31 + 91 * glow + grid))
                  b = int(min(255, 55 + 166 * glow + grid))
                  rows.extend((r, g, b))

          def chunk(kind: bytes, data: bytes) -> bytes:
              crc = zlib.crc32(kind + data) & 0xFFFFFFFF
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", crc)

          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(bytes(rows), 9))
              + chunk(b"IEND", b"")
          )
          output.write_bytes(png)
          print(f"wrote {output} ({len(png)} bytes, RGB 1024x1024)")
          PY

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          chmod +x scripts/generate_project.sh scripts/build_unsigned_ipa.sh
          ./scripts/build_unsigned_ipa.sh "$RUNNER_TEMP/meshscope-output"

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/meshscope-output/MeshScope-unsigned.ipa"
          REPORT="$RUNNER_TEMP/meshscope-output/build-report.txt"
          EXTRACTED="$RUNNER_TEMP/meshscope-validation"

          test -s "$IPA"
          unzip -t "$IPA"
          rm -rf "$EXTRACTED"
          mkdir -p "$EXTRACTED"
          unzip -q "$IPA" -d "$EXTRACTED"

          APP="$EXTRACTED/Payload/MeshScope.app"
          BINARY="$APP/MeshScope"
          test -d "$APP"
          test -f "$BINARY"
          test -f "$APP/Info.plist"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          MIN_IOS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          test "$BUNDLE_ID" = 'com.famsyk.MeshScope'
          test "$MIN_IOS" = '17.0'

          if find "$APP" -type d -name _CodeSignature -print -quit | grep -q .; then
            echo 'Unexpected code signature directory found.' >&2
            exit 1
          fi

          if codesign -dv "$APP" >/dev/null 2>&1; then
            echo 'App unexpectedly has a valid code signature.' >&2
            exit 1
          fi

          {
            echo 'MeshScope unsigned IPA build'
            echo "Bundle ID: $BUNDLE_ID"
            echo "Minimum iOS: $MIN_IOS"
            echo "Binary: $(file "$BINARY")"
            echo "IPA bytes: $(stat -f '%z' "$IPA")"
            echo "SHA-256: $(shasum -a 256 "$IPA" | awk '{print $1}')"
            echo 'Code signing: none'
          } | tee "$REPORT"

          shasum -a 256 "$IPA" > "$RUNNER_TEMP/meshscope-output/MeshScope-unsigned.ipa.sha256"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeshScope-unsigned-IPA
          path: |
            ${{ runner.temp }}/meshscope-output/MeshScope-unsigned.ipa
            ${{ runner.temp }}/meshscope-output/MeshScope-unsigned.ipa.sha256
            ${{ runner.temp }}/meshscope-output/README.txt
            ${{ runner.temp }}/meshscope-output/build-report.txt
          if-no-files-found: error
          retention-days: 7
