name: Track PAL and Classic Betas

on:
  push:
    branches: [main]
    paths: ['.github/**', 'source.json', 'pal-source.json', 'classic-source.json']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acbs-beta-source
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1

      - name: Run all offline regression tests
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Verify both PAL packages and the separate Classic IPA
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$GITHUB_EVENT_NAME" != 'schedule' ]]; then args+=(--force); fi
          python3 -B .github/scripts/update_catalog.py "${args[@]}"
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Publish all catalogs in one commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- source.json pal-source.json classic-source.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified PAL and Classic beta catalogs'
          elif (( $(date +%s) - $(git log -1 --format=%ct) >= 2592000 )); then
            git commit --allow-empty -m 'Keep beta tracking active'
          else
            exit 0
          fi
          # Never overwrite concurrent edits with a force push.
          git push origin HEAD:main

      - name: Verify both public PAL URLs and the separate IPA URL
        shell: bash
        run: |
          python3 -B - <<'PY'
          import json, os, sys, time, urllib.request
          from pathlib import Path
          sys.path.insert(0, '.github/scripts')
          from update_catalog import OUTPUTS, validate_pal
          for name in OUTPUTS:
              expected = json.loads(Path(name).read_text())
              url = f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/main/{name}"
              for attempt in range(16):
                  try:
                      req = urllib.request.Request(url, headers={'Cache-Control':'no-cache', 'User-Agent':'acbs-catalog/2.0'})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          if response.status != 200:
                              raise ValueError(f'HTTP {response.status}')
                          actual = json.load(response)
                      if actual != expected:
                          raise ValueError('GitHub CDN still has older content')
                      if name != 'classic-source.json':
                          validate_pal(actual)
                      versions = [a['name'] + ': ' + a['versions'][0].get('marketingVersion', a['versions'][0]['version']) for a in actual['apps']]
                      print('PUBLIC_URL_OK: HTTP 200, valid JSON, '+name+' | '+', '.join(versions), flush=True)
                      break
                  except Exception as exc:
                      if attempt == 15:
                          raise
                      print(f'Waiting for {name}: {exc}', flush=True)
                      time.sleep(15)
          PY
