name: Track AltStore PAL Beta

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-pal-beta.yml'
      - '.github/scripts/update_pal_source.py'
      - '.github/scripts/test_pal_source.py'
      - 'pal-source.json'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Share the lock with the Classic tracker so neither overwrites concurrent work.
concurrency:
  group: acbs-beta-source
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1

      - name: Run PAL validation tests
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_pal_source.py' -v

      - name: Verify public PAL beta ADP and iPhone variant
        run: python3 -B .github/scripts/update_pal_source.py

      - name: Publish PAL source without touching Classic source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pal-source.json
          if git diff --cached --quiet; then
            echo 'PAL source is already current.'
            exit 0
          fi
          git commit -m 'Update verified public AltStore PAL beta metadata'
          git push origin HEAD:main

      - name: Verify published PAL JSON URL
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          expected = json.loads(Path('pal-source.json').read_text())
          url = f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/main/pal-source.json"
          for attempt in range(16):
              try:
                  request = urllib.request.Request(url, headers={'Cache-Control':'no-cache', 'User-Agent':'acbs-pal-beta-track/1.0'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status != 200:
                          raise ValueError(f'HTTP {response.status}')
                      published = json.load(response)
                  if published != expected:
                      raise ValueError('Published JSON does not yet match generated source')
                  version = published['apps'][0]['versions'][0]
                  print('PAL_PUBLIC_URL_OK: HTTP 200, valid JSON, ' + version.get('marketingVersion', version['version']))
                  print(url)
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                      summary.write('\nPublic source URL verified: ' + url + '\n')
                  break
              except Exception as exc:
                  if attempt == 15:
                      raise
                  print('Waiting for public source: ' + str(exc), flush=True)
                  time.sleep(20)
          PY
